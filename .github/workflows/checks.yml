name: Project checks
on:
  workflow_call:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/check.test.mjs
      - run: node --check web/app.js && node --check web/backend.js
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start --help
      - run: supabase start -x studio,imgproxy,storage-api,edge-runtime,realtime,logflare,vector,supavisor
        timeout-minutes: 8
      - run: supabase test db
      - if: always()
        run: supabase stop --no-backup
